min_version = "2026.11.4"

# Linux server setup only. Run from this directory, never from the Mac profile.
[vars]
rex_hostname = "{{ exec(command='hostname -s') }}-rex"
node_version = "26.13.0"
rust_version = "1.99.1"
nvim_version = "0.12.6"
fzf_version = "0.75.0"
eza_version = "0.23.5"
lazygit_version = "0.66.3"
treesitter_version = "0.27.2"
starship_version = "1.27.0"
gh_version = "2.103.3"
op_version = "2.42.0"
ruby_version = "3.4.12"
kamal_version = "2.12.0"

[tools]
node = "{{ vars.node_version }}"
rust = "{{ vars.rust_version }}"
ruby = "{{ vars.ruby_version }}"
"gem:kamal" = "{{ vars.kamal_version }}"
"aqua:neovim/neovim" = "{{ vars.nvim_version }}"
"aqua:junegunn/fzf" = "{{ vars.fzf_version }}"
"aqua:eza-community/eza" = "{{ vars.eza_version }}"
"aqua:jesseduffield/lazygit" = "{{ vars.lazygit_version }}"
"aqua:tree-sitter/tree-sitter" = "{{ vars.treesitter_version }}"
"aqua:starship/starship" = "{{ vars.starship_version }}"
"aqua:cli/cli" = "{{ vars.gh_version }}"
"aqua:1password/cli" = "{{ vars.op_version }}"

[bootstrap.packages]
"apt:ca-certificates" = "latest"
"apt:curl" = "latest"
"apt:gnupg" = "latest"
"apt:git" = "latest"
"apt:fish" = "latest"
"apt:ripgrep" = "latest"
"apt:fd-find" = "latest"
"apt:build-essential" = "latest"
"apt:pkg-config" = "latest"
"apt:python3" = "latest"
"apt:unzip" = "latest"
"apt:xz-utils" = "latest"
"apt:locales" = "latest"
"apt:ncurses-bin" = "latest"
"apt:openssh-client" = "latest"
"apt:docker-ce" = "latest"
"apt:docker-ce-cli" = "latest"
"apt:containerd.io" = "latest"
"apt:docker-buildx-plugin" = "latest"
"apt:docker-compose-plugin" = "latest"
"apt:tailscale" = "latest"
"apt:rex" = "latest"

[bootstrap.apt.sources.docker]
uris = "https://download.docker.com/linux/ubuntu"
components = "stable"
key = "https://download.docker.com/linux/ubuntu/gpg"
fingerprint = "9DC858229FC7DD38854AE2D88D81803C0EBFCD88"

[bootstrap.apt.sources.tailscale]
uris = "https://pkgs.tailscale.com/stable/ubuntu"
key = "https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg"
fingerprint = "2596A99EAAB33821893C0A79458CA832957F5868"

[bootstrap.apt.sources.rex]
uris = "https://pkgs.superlogical.com/rex/apt"
suites = "snapshot"
key = "https://pkgs.superlogical.com/rex/keys/rex-archive-keyring.gpg"
fingerprint = "E28636AC71905C6DDE40C1EDFAA6B80F641307A7"

[bootstrap.groups.docker]
system = true

[bootstrap.users.shulhi]
group = "shulhi"
groups = ["docker"]

[bootstrap.directories."~/.dotfiles/active-theme"]
mode = "0755"

[bootstrap.directories."~/.local/state/server-bootstrap/backups"]
owner = "shulhi"
group = "shulhi"
mode = "0700"

[bootstrap.files."~/.config/systemd/user/rex.service.d/20-tailscale.conf"]
template = true
mode = "0644"
content = """
[Service]
ExecStart=
ExecStart=/usr/bin/rex server run --log-format text --tailscale --tailscale-hostname {{ vars.rex_hostname }}
"""

[bootstrap.services.docker]
state = "running"
enabled = true

[bootstrap.services.tailscaled]
state = "running"
enabled = true

[bootstrap.services."rex.socket"]
scope = "user"
state = "running"
enabled = true

# Runs after tools and the post-tools build hook. The wrapper resolves the
# Tailscale address at startup, so first-time sign-in can happen after bootstrap.
[bootstrap.services.portside]
scope = "user"
command = "~/.dotfiles/server/scripts/portside-run.sh"
description = "Portside private TCP forwarding over Tailscale"
requires_tools = true
restart = "on-failure"
working_directory = "~"
state = "running"
enabled = true

[bootstrap.repos]
"~/Dev/codemorehq/shippdf/shippdf-marketing" = { url = "git@github.com:ShipPDF/shippdf-marketing.git" }
"~/Dev/codemorehq/shippdf/shippdf-app" = { url = "git@github.com:ShipPDF/shippdf-app.git" }
"~/Dev/portside" = { url = "git@github.com:shulhi/portside.git" }

[dotfiles]
"~/.config/nvim" = { source = "../vim/nvim", mode = "symlink" }
"~/.config/fish/config.fish" = { source = "../fish/config.fish", mode = "symlink" }
"~/.config/starship.toml" = { source = "../starship2.toml", mode = "symlink" }
"~/.config/fish/conf.d/10-server-bootstrap-mise.fish" = { source = "templates/mise.fish", mode = "copy" }
"~/.config/mise/conf.d/server-tools.toml" = { source = "templates/global-tools.toml", mode = "template" }

[bootstrap.user]
login_shell = "/usr/bin/fish"

[bootstrap.hooks]
pre-packages = "bash scripts/prepare-host.sh"
post-packages = "bash scripts/after-packages.sh"
pre-repos = "bash scripts/git.sh"
pre-dotfiles = "bash scripts/prepare-dotfiles.sh"
post-tools = "bash scripts/after-tools.sh"
final = "bash scripts/verify.sh"

[tasks.bootstrap]
description = "Finish native CLI setup and restore Neovim plugins"
run = [
  "bash scripts/ai-tools.sh",
  "bash scripts/plugins.sh",
]

[tasks.portside]
description = "Rebuild and restart only the Portside server"
run = [
  "bash scripts/portside-build.sh",
  "systemctl --user restart dev.mise.portside.service",
]

[tasks.verify]
description = "Verify tools, Docker, Tailscale, Rex, and Portside"
run = "bash scripts/verify.sh"
